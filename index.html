
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسکن موبایل‌فروشی حسینی</title>
<style>
body{font-family:Arial;background:#f2f4f8;padding:15px}
main{background:white;padding:18px;border-radius:12px;max-width:600px;margin:auto}
button{padding:13px;margin:5px;background:#1769aa;color:white;border:0;border-radius:8px;font-size:16px}
button:disabled{opacity:.5}
video{width:100%;max-height:420px;object-fit:contain;background:#222;margin-top:12px}
input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}
#status{padding:12px;background:#edf5fc;border-radius:8px;word-break:break-word}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
td,th{border:1px solid #ddd;padding:7px;text-align:center}
</style>
</head>
<body>
<main>
<h2>موبایل‌فروشی حسینی</h2>
<p>اسکن بارکد و IMEI موبایل</p>

<button id="start">شروع اسکن دوربین</button>
<button id="stop">توقف دوربین</button>

<video id="video" autoplay playsinline muted></video>
<p id="status">آماده اسکن</p>

<label>کد خوانده‌شده:</label>
<input id="code" placeholder="بارکد یا IMEI">

<label>نام شرکت:</label>
<input id="company" placeholder="Samsung">

<label>مدل موبایل:</label>
<input id="model">

<label>RAM:</label>
<input id="ram">

<label>حافظه:</label>
<input id="storage">

<label>IMEI:</label>
<input id="imei">

<label>رنگ:</label>
<input id="color">

<label>تعداد:</label>
<input id="qty" type="number" value="1">

<label>قیمت خرید:</label>
<input id="cost" type="number">

<button id="lookup">گرفتن اطلاعات موبایل</button>
<button id="add">اضافه کردن</button>

<h3>موبایل‌های ثبت‌شده</h3>
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>IMEI</th>
<th>شرکت</th>
<th>مدل</th>
<th>تعداد</th>
<th>قیمت خرید</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</main>

<script type="module">
import { BrowserMultiFormatReader }
from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm';

const reader = new BrowserMultiFormatReader();
let controls = null;

const video = document.getElementById('video');
const status = document.getElementById('status');
const start = document.getElementById('start');
const stop = document.getElementById('stop');

start.onclick = async () => {
 try {
  if (!window.isSecureContext) {
   status.textContent = 'لطفاً سایت را با HTTPS باز کنید.';
   return;
  }

  if (controls) {
   controls.stop();
   controls = null;
  }

  status.textContent = 'در حال فعال کردن دوربین...';
  start.disabled = true;

  const constraints = {
   audio: false,
   video: {
    facingMode: { ideal: 'environment' },
    width: { ideal: 1920 },
    height: { ideal: 1080 },
    frameRate: { ideal: 30 },
    advanced: [{ focusMode: 'continuous' }]
   }
  };

  controls = await reader.decodeFromConstraints(
   constraints,
   video,
   (result, error) => {
    if (result) {
     const value = result.getText();
     document.getElementById('code').value = value;

     if (/^\d{14,16}$/.test(value)) {
      document.getElementById('imei').value = value;
     }

     status.textContent = 'کد خوانده شد: ' + value;
    }
   }
  );

  status.textContent =
   'دوربین فعال است؛ بارکد را مقابل دوربین بگیرید.';

 } catch (e) {
  status.textContent = 'خطای دوربین: ' + e.name + ' - ' + e.message;
 } finally {
  start.disabled = false;
 }
};

stop.onclick = () => {
 if (controls) {
  controls.stop();
  controls = null;
 }
 video.srcObject = null;
 status.textContent = 'دوربین متوقف شد.';
 start.disabled = false;
};

// ذخیره اطلاعات در مرورگر
const fields = [
 'code','company','model','ram',
 'storage','imei','color','qty','cost'
];

function getRecords(){
 try {
  return JSON.parse(localStorage.getItem('hosseiniRecords') || '[]');
 } catch(e) {
  return [];
 }
}

function showRecords(){
 const records = getRecords();
 document.getElementById('records').innerHTML = '';

 records.forEach(item => {
  const tr = document.createElement('tr');

  [item.imei,item.company,item.model,item.qty,item.cost]
   .forEach(value => {
    const td = document.createElement('td');
    td.textContent = value || '';
    tr.appendChild(td);
   });

  document.getElementById('records').appendChild(tr);
 });
}

document.getElementById('add').onclick = () => {
 const item = {};

 fields.forEach(id => {
  item[id] = document.getElementById(id).value.trim();
 });

 if (!item.imei && !item.code) {
  status.textContent = 'لطفاً اول IMEI یا بارکد را وارد کنید.';
  return;
 }

 const records = getRecords();
 records.push(item);

 try {
  localStorage.setItem('hosseiniRecords', JSON.stringify(records));
  showRecords();
  status.textContent = 'اطلاعات با موفقیت در این مرورگر ثبت شد.';

  fields.forEach(id => {
   if(id !== 'qty') document.getElementById(id).value = '';
  });
  document.getElementById('qty').value = '1';

 } catch(e) {
  status.textContent = 'ذخیره اطلاعات انجام نشد.';
 }
};

// جست‌وجوی مشخصات بر اساس IMEI
document.getElementById('lookup').onclick = () => {
 const imei = document.getElementById('imei').value.trim()
  || document.getElementById('code').value.trim();

 if (!imei) {
  status.textContent = 'اول IMEI موبایل را اسکن کنید.';
  return;
 }

 const url = 'https://www.google.com/search?q=' +
  encodeURIComponent('phone model specifications IMEI ' + imei);

 window.open(url, '_blank');
 status.textContent =
  'نتایج جست‌وجوی IMEI باز شد. مشخصات را بررسی کنید.';
};

showRecords();
</script>
</body>
</html>
